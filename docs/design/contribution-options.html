    :root{color-scheme:light;--bg:#faf7f2;--surface:#fffdf9;--text:#24211e;--muted:#625b55;--accent:#a43d27;--soft:#f0e3da;--line:#ded7cf}
    :root[data-theme=dark]{color-scheme:dark;--bg:#181715;--surface:#211f1c;--text:#f3eee7;--muted:#c1b7aa;--accent:#f49c82;--soft:#362720;--line:#48423b}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 Onest,Arial,sans-serif;-webkit-font-smoothing:antialiased}
    button,summary{font:inherit;cursor:pointer;touch-action:manipulation}button{color:inherit}button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:5px}
    a{color:inherit;text-underline-offset:5px}button{border:0}h1,h2,h3,p{margin:0}h1,h2,h3{font-weight:550;line-height:1.13;letter-spacing:-.045em;text-wrap:balance}h1{font-size:clamp(36px,4.8vw,66px)}h2{font-size:clamp(28px,3vw,42px)}h3{font-size:21px;letter-spacing:-.025em}
    [hidden]{display:none!important}.wrap{width:min(1180px,calc(100% - 88px));margin:auto}.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:650;color:var(--accent)}.muted{color:var(--muted)}.study{background:var(--surface);border-bottom:1px solid var(--line);padding:20px 0}
    .study-head,.toolbar,.brandbar,.row{display:flex;align-items:center;justify-content:space-between;gap:20px}.study-head p{font-size:12px;color:var(--muted)}.tools{display:flex;gap:8px;flex-shrink:0}.utility{padding:8px 13px;border:1px solid var(--line);border-radius:5px;background:var(--bg);font-size:12px;min-height:40px}
    .toolbar{margin-top:17px}.choices{display:flex;gap:6px;flex-wrap:wrap}.choice{background:transparent;padding:10px 16px;border-radius:5px;font-size:13px;border:1px solid var(--line)}.choice[aria-pressed=true]{background:var(--text);color:var(--bg);border-color:var(--text)}.study-note{font-size:12px;color:var(--muted)}
    .rationale{display:grid;grid-template-columns:1fr 1fr;gap:25px;padding:18px 0;border-bottom:1px solid var(--line);font-size:13px}.rationale strong{font-weight:600}.rationale p{color:var(--muted)}.rationale strong{color:var(--text)}
    .brandbar{padding:27px 0;border-bottom:1px solid var(--line)}.brand{font-weight:600;font-size:18px;letter-spacing:-.04em}.brand span{color:var(--accent)}.sample-nav{display:flex;gap:25px;font-size:12px;color:var(--muted)}.sample-nav .active{color:var(--accent)}

nvestigation"}]},{"id":"sources","nodes":[{"title":"Knowledge base"},{"title":"Current code"},{"title":"Datadog logs"},{"title":"Documentation + Jira"}]}],"description":"Both access channels used the same knowledge foundation. Knowledge maintenance and deployment monitoring were additional team workflows, with updates and reports shared in Slack."},"details":[{"id":"context","title":"The problem and my contribution","paragraphs":["Questions from TAMs, KAMs, PMs and engineers repeatedly depended on my SDK context and VTEX experience. Requests and on-call investigations competed with sprint work, and even simple questions could wait for my availability.","I initiated and implemented Yunex end to end. I consolidated six months of tasks, discussions, documentation and incident history, cross-checked conflicting information and organized the knowledge into Markdown topic modules.","I added Yunex to the existing Core Checkout Claude plugin and used the AI team’s company-agent platform to make questions and investigations accessible through Slack. The terminal workflow could also support engineers implementing sprint features."]},{"id":"decisions","title":"Decisions behind the workflows","paragraphs":["I chose shared access over a personal assistant so requests could reach the knowledge directly. Engineers kept a terminal workflow; nontechnical colleagues could use Slack without learning another interface.","Conceptual questions started with relevant knowledge modules and targeted code checks. Incident investigations relied more heavily on current code and Datadog logs. Selecting sources according to the question was intended to avoid unnecessary retrieval and token use.","Knowledge-update collection and proposal creation ran daily, while acceptance remained a human review step. Monitoring ran locally and reported its assessments to a shared Slack channel, giving the team visibility and a trace of the deployment review."]},{"id":"validation","title":"Evaluation and continuous refinement","paragraphs":["I compared responses with previously resolved questions and incidents, asked the agent not to use historical answers during those exercises and added new evaluation scenarios. I also supervised initial company-wide responses for correctness, freshness and possible hallucinations.","The agent was instructed not to invent information, to communicate high, medium or low confidence in hypotheses and to request more context when needed. I personally investigated unresolved cases and refined the workflow based on missing information or an unsuitable investigation path.","Colleagues increasingly came to me to validate an existing answer, which required less effort than handling the whole request. Nontechnical colleagues also reported saving time by clarifying questions directly in Slack."]},{"id":"incident","title":"In practice: investigating order cancellations","paragraphs":["Merchants reported order cancellations attributed to the plugin. Colleagues used Yunex to investigate and inspect logs, identifying intermittent VTEX API failures that prevented some payments from completing.","The investigation helped distinguish an upstream platform failure from an error originating in the plugin, giving the team a clearer explanation of the reported behavior."]}]},"es":{"id":"yunex","name":"Yunex","company":"Yuno","headline":"Conocimiento especializado al servicio del equipo.","summary":"Diseñé y desarrollé una herramienta asistida por IA para la integración Yuno–VTEX: consultas e investigación de incidentes, actualización automática del conocimiento y monitoreo posterior al despliegue. Ingeniería la utilizaba desde la terminal; otros compañeros accedían a su agente de consultas e investigación desde Slack.","ownership":"Iniciativa propia · Diseño, implementación y evaluación continua","impact":"El equipo obtuvo acceso directo al conocimiento de la integración, reduciendo la dependencia de un único especialista. Las propuestas diarias de actualización ayudaban a mantenerlo vigente y los reportes compartidos de despliegues daban visibilidad del comportamiento en producción. Mis compañeros reportaron ahorro de tiempo y observé una reducción considerable de las consultas directas.","capabilities":[{"id":"investigation","title":"Consultas e investigación de incidentes","description":"El conocimiento relevante, código actual, logs de Datadog, documentación y contexto de Jira apoyaban las consultas de producto y las investigaciones de on-call. El agente podía expresar incertidumbre y solicitar información faltante."},{"id":"knowledge","title":"Mantenimiento automático del conocimiento","description":"Una Routine diaria de Claude recopilaba cambios del producto e incidentes, proponía actualizaciones de la base de conocimiento en un PR y notificaba en Slack para revisión y aprobación del equipo."},{"id":"monitoring","title":"Monitoreo posterior al despliegue","description":"Una skill ejecutada localmente revisaba los logs de producción en Datadog durante una hora tras un despliegue y publicaba evaluaciones cada cinco minutos en Slack para que el equipo revisara los hallazgos y actuara."}],"diagram":{"caption":"Vista conceptual · acceso e investigación","stages":[{"id":"access","nodes":[{"title":"Terminal del equipo","description":"Plugin existente de Claude"},{"title":"Slack de la empresa","description":"Agente interno"}]},{"id":"investigation","emphasized":true,"nodes":[{"title":"Yunex","description":"Consultas e investigación compartidas"}]},{"id":"sources","nodes":[{"title":"Base de conocimiento"},{"title":"Código actual"},{"title":"Logs de Datadog"},{"title":"Documentación + Jira"}]}],"description":"Ambos canales utilizaban el mismo conocimiento. Su mantenimiento y el monitoreo de despliegues eran flujos adicionales del equipo, con actualizaciones y reportes compartidos en Slack."},"details":[{"id":"context","title":"El problema y mi contribución","paragraphs":["Las preguntas de TAMs, KAMs, PMs e ingeniería dependían repetidamente de mi contexto del SDK y experiencia en VTEX. Las consultas e investigaciones de on-call competían con las tareas del sprint, e incluso preguntas sencillas debían esperar a que tuviera disponibilidad.","Propuse e implementé Yunex de principio a fin. Consolidé seis meses de tareas, conversaciones, documentación e incidentes, contrasté información contradictoria y organicé el conocimiento en módulos temáticos en Markdown.","Añadí Yunex al plugin existente de Claude de Core Checkout y utilicé la plataforma de agentes del equipo de IA para ofrecer consultas e investigación desde Slack. El flujo de terminal también podía apoyar a ingeniería en la implementación de funcionalidades del sprint."]},{"id":"decisions","title":"Las decisiones detrás de los flujos","paragraphs":["Elegí ofrecer acceso compartido en lugar de un asistente personal para que las consultas llegaran directamente al conocimiento. Ingeniería conservaba un flujo en terminal y los roles no técnicos podían utilizar Slack sin aprender otra interfaz.","Las consultas conceptuales partían de módulos relevantes y comprobaciones puntuales del código. Las investigaciones de incidentes se apoyaban más en el código actual y los logs de Datadog. Seleccionar las fuentes según la consulta buscaba evitar búsquedas y consumo de tokens innecesarios.","La recopilación y propuesta de actualizaciones del conocimiento se ejecutaba diariamente, mientras la aceptación mantenía un paso de revisión humana. El monitoreo se ejecutaba localmente y compartía sus evaluaciones en Slack para dar visibilidad y trazabilidad de la revisión de cada despliegue."]},{"id":"validation","title":"Evaluación y refinamiento continuo","paragraphs":["Comparé las respuestas con consultas e incidentes resueltos, pedí al agente que no utilizara respuestas históricas durante esos ejercicios y añadí escenarios nuevos de evaluación. También supervisé las respuestas iniciales en Slack para comprobar su exactitud, vigencia y posibles alucinaciones.","El agente tenía instrucciones de no inventar información, comunicar confianza alta, media o baja en las hipótesis y solicitar más contexto cuando fuera necesario. Investigué personalmente los casos sin resolver y refiné el flujo según la información faltante o el procedimiento utilizado.","Mis compañeros acudían cada vez más a mí para validar una respuesta existente, lo cual requería menos esfuerzo que abordar la consulta completa. Los roles no técnicos también reportaron ahorro de tiempo al aclarar dudas directamente en Slack."]},{"id":"incident","title":"En la práctica: investigar cancelaciones de órdenes","paragraphs":["Los merchants reportaron cancelaciones de órdenes atribuidas al plugin. Mis compañeros utilizaron Yunex para investigar y revisar logs, identificando fallos intermitentes en las APIs de VTEX que impedían completar algunos pagos.","La investigación ayudó a distinguir un fallo de la plataforma externa de un error originado en el plugin, dando al equipo una explicación más clara del comportamiento reportado."]}]}};
    for (const lang of ['en','es']) {
      const entry = selectedCases[lang];
      Object.assign(copy[lang], {
        title: entry.headline, summary: entry.summary, ownership: entry.ownership,
        outcome: entry.impact, outcomeLabel: lang === 'en' ? 'Value for the team' : 'Valor para el equipo',
        diagramLabel: entry.diagram.caption, diagramNote: entry.diagram.description,
        studyNote: lang === 'en' ? 'Selected direction: option 2 · interactive study' : 'Diseño elegido: opción 2 · vista interactiva',
        capabilitiesLabel: lang === 'en' ? 'What the solution made possible' : 'Lo que hizo posible la solución',
        incidentToggle: lang === 'en' ? 'Context, decisions and validation' : 'Contexto, decisiones y validación',
        evidence: ''
      });
    }
    const params = new URLSearchParams(location.search);
    let locale = params.get('lang') === 'es' ? 'es' : 'en';
    let variant = ['1','2','3'].includes(params.get('variant')) ? params.get('variant') : '2';
    let theme = ['light','dark'].includes(params.get('theme')) ? params.get('theme') : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    let article = false;
    const main = document.getElementById('main');
    const outcome = t => `<div class="outcome"><span class="eyebrow">${t.outcomeLabel}</span><p>${t.outcome}</p></div>`;
    const steps = t => `<div class="steps">${[['problem','problemTitle','problemCopy'],['contribution','contributionTitle','contributionCopy'],['decision','decisionTitle','decisionCopy']].map(keys=>`<section class="step"><span class="eyebrow">${t[keys[0]]}</span><h3>${t[keys[1]]}</h3><p>${t[keys[2]]}</p></section>`).join('')}</div>`;
    const diagram = t => `<figure class="diagram" style="margin:0"><p>${t.diagramLabel}</p><div class="entry-grid"><div class="node">${t.terminal}<small>${t.terminalSub}</small></div><div class="node">${t.slack}<small>${t.slackSub}</small></div></div><div class="connector" aria-hidden="true"></div><div class="hub">${t.hub}<small>${t.hubSub}</small></div><div class="connector" aria-hidden="true"></div><div class="source-grid">${['kb','code','logs','context'].map(key=>`<div class="node">${t[key]}</div>`).join('')}</div><figcaption class="diagram-note muted">${t.diagramNote}</figcaption></figure>`;
    const incident = t => `<section class="case-example"><h3>${t.incidentTitle}</h3><p>${t.incidentCopy}</p><p>${t.incidentResult}</p></section>`;
    function render(){
      const t = copy[locale];
      const openDetails = [...main.querySelectorAll('details')].map(detail=>detail.open);
      document.documentElement.lang=locale;document.documentElement.dataset.theme=theme;
      document.title=locale==='en'?'Contribution presentation study · Hugo Riveros':'Propuestas para contribuciones · Hugo Riveros';
      document.querySelectorAll('[data-text]').forEach(el=>{el.textContent=t[el.dataset.text]});
      document.querySelectorAll('[data-variant]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.variant===variant)));
      document.querySelector('.toolbar').setAttribute('aria-label',locale==='en'?'Presentation alternatives':'Alternativas de presentación');
      document.querySelector('.rationale').setAttribute('aria-label',locale==='en'?'Design rationale':'Criterio de diseño');
      document.getElementById('placement').textContent=t.placement[Number(variant)-1];
      document.getElementById('tradeoff').textContent=t.tradeoff[Number(variant)-1];
      document.getElementById('active-nav').textContent=t.contributions;
      document.getElementById('active-nav').classList.toggle('active',variant!=='1');
      document.querySelector('[data-text=work]').classList.toggle('active',variant==='1');
      const langButton=document.getElementById('language');langButton.textContent=locale==='en'?'ES':'EN';langButton.setAttribute('aria-label',t.switchLanguage);
      const themeButton=document.getElementById('theme');themeButton.textContent=theme==='light'?t.dark:t.light;themeButton.setAttribute('aria-label',t.switchTheme);
      if(variant==='1') main.innerHTML=`<div class="intro"><p class="eyebrow">${t.work}</p><h1>${t.experienceTitle}</h1><p>${t.experienceIntro}</p></div><article class="experience"><div class="company"><h2>Yuno</h2><p>${t.companyContext}</p></div><div><div class="role-head"><h3>${t.role}</h3><p>${t.period}</p></div><p class="role-copy">${t.roleSummary}</p><ul class="work-list"><li>${t.work1}</li><li>${t.work2}</li></ul><section class="embedded"><div class="embedded-lead"><p class="eyebrow">${t.label} / ${t.contributions}</p><h3>${t.title}</h3><p>${t.summary}</p>${outcome(t)}</div><details><summary>${t.details}</summary><div class="detail-content">${steps(t)}<div style="margin-top:28px">${incident(t)}</div><p class="ownership">${t.ownership}</p></div></details></section></div></article>`;
      if(variant==='2') main.innerHTML=`<div class="intro"><p class="eyebrow">${t.contributions}</p><h1>${t.featureTitle}</h1><p>${t.featureIntro}</p></div><article><div class="feature"><div><p class="eyebrow">${t.label}</p><h2>${t.title}</h2><p class="feature-copy">${t.summary}</p><p class="ownership">${t.ownership}</p>${outcome(t)}</div>${diagram(t)}</div><div class="feature-steps"><p class="eyebrow" style="margin-bottom:14px">${t.capabilitiesLabel}</p><div class="steps">${selectedCases[locale].capabilities.map(capability=>`<section class="step"><h3>${capability.title}</h3><p>${capability.description}</p></section>`).join('')}</div></div><details class="feature-details"><summary>${t.incidentToggle}</summary><div class="detail-content">${steps(t)}<div style="margin-top:26px">${incident(t)}</div><section class="case-example" style="margin-top:27px"><h3>${t.validationTitle}</h3><p>${t.validationCopy}</p></section></div></details></article>`;
      if(variant==='3'&&!article) main.innerHTML=`<div class="intro"><p class="eyebrow">${t.contributions}</p><h1>${t.libraryTitle}</h1><p>${t.libraryIntro}</p></div><article class="library-card"><div class="cover"><p class="eyebrow">${t.label}</p><p class="big-name">Yunex<span style="font-size:32px">↗</span></p><p class="cover-caption">${t.coverCaption}</p><p class="mini-path">${t.miniPath}</p></div><div class="card-story"><p class="eyebrow">${t.ownership}</p><h2>${t.cardTitle}</h2><p>${t.summary}</p>${outcome(t)}<button type="button" class="primary" id="open-case">${t.readCase}</button></div></article>`;
      if(variant==='3'&&article) main.innerHTML=`<button type="button" class="back" id="close-case">${t.back}</button><article><header class="article-head"><p class="eyebrow">${t.caseLabel}</p><h1 tabindex="-1" id="case-heading">${t.caseTitle}</h1><p>${t.caseIntro}</p></header><div class="article-meta">${[['roleLabel','roleValue'],['audienceLabel','audienceValue'],['scopeLabel','scopeValue']].map(keys=>`<div><p class="eyebrow">${t[keys[0]]}</p><p>${t[keys[1]]}</p></div>`).join('')}</div><div class="article-layout"><nav class="article-index" aria-label="${t.contributions}">${['Problem','Approach','Decisions','Validation','Outcome'].map(key=>`<a href="#case-${key.toLowerCase()}">${t['index'+key]}</a>`).join('')}</nav><div class="article-body"><section id="case-problem"><h2>${t.articleProblem}</h2><p>${t.problemCopy}</p></section><section id="case-approach"><h2>${t.articleApproach}</h2><p>${t.articleApproachCopy}</p>${diagram(t)}<p style="margin-top:20px">${t.articleOperations}</p></section><section id="case-decisions"><h2>${t.articleDecisions}</h2><p>${t.articleDecisionsCopy}</p></section><section id="case-validation"><h2>${t.articleValidation}</h2><p>${t.validationCopy}</p><div style="margin-top:25px">${incident(t)}</div></section><section id="case-outcome"><h2>${t.articleOutcome}</h2><p>${t.articleOutcomeCopy}</p><p class="evidence-note">${t.outcomeNote}</p></section></div></div></article>`;
      main.querySelectorAll('details').forEach((el,index)=>{el.open=openDetails[index]||false});
      document.getElementById('open-case')?.addEventListener('click',()=>{article=true;render();document.getElementById('case-heading').focus();window.scrollTo(0,0)});
      document.getElementById('close-case')?.addEventListener('click',()=>{article=false;render();document.getElementById('open-case').focus();window.scrollTo(0,0)});
      if(location.protocol!=='file:')history.replaceState(null,'',`?variant=${variant}&lang=${locale}&theme=${theme}`);
    }
    document.querySelectorAll('[data-variant]').forEach(button=>button.addEventListener('click',()=>{variant=button.dataset.variant;article=false;main.innerHTML='';render()}));
    document.getElementById('language').addEventListener('click',()=>{locale=locale==='en'?'es':'en';render()});
    document.getElementById('theme').addEventListener('click',()=>{theme=theme==='light'?'dark':'light';render()});
    render();
  </script>
</body>
</html>
